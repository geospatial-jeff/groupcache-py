version: '3.8'

services:
  node1:
    build:
      context: ..
      dockerfile: example/Dockerfile
    platform: linux/amd64
    container_name: groupcache-node1
    hostname: node1
    environment:
      - NODE_ID=1
      - PORT=8080
      - TOTAL_NODES=3
      - SELF_URL=http://node1:8080
      - PEER_URLS=http://node2:8080,http://node3:8080
    ports:
      - "8081:8080"
    networks:
      - groupcache-net

  node2:
    build:
      context: ..
      dockerfile: example/Dockerfile
    platform: linux/amd64
    container_name: groupcache-node2
    hostname: node2
    environment:
      - NODE_ID=2
      - PORT=8080
      - TOTAL_NODES=3
      - SELF_URL=http://node2:8080
      - PEER_URLS=http://node1:8080,http://node3:8080
    ports:
      - "8082:8080"
    networks:
      - groupcache-net
    depends_on:
      - node1

  node3:
    build:
      context: ..
      dockerfile: example/Dockerfile
    platform: linux/amd64
    container_name: groupcache-node3
    hostname: node3
    environment:
      - NODE_ID=3
      - PORT=8080
      - TOTAL_NODES=3
      - SELF_URL=http://node3:8080
      - PEER_URLS=http://node1:8080,http://node2:8080
    ports:
      - "8083:8080"
    networks:
      - groupcache-net
    depends_on:
      - node1

networks:
  groupcache-net:
    driver: bridge